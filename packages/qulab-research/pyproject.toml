[project]
name = "qulab-research"
version = "1.0.0"
description = "ECH0 Autonomous Research Agent Service"
requires-python = ">=3.10"
authors = [{name = "Joshua Hendricks Cole", email = "jhendrickscole@aios.is"}]
dependencies = ["fastapi>=0.110.0", "uvicorn>=0.20.0", "httpx>=0.27.0"]
[project.scripts]
qulab-research = "qulab_research.__main__:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["qulab_research"]
