[project]
name = "qulab-billing"
version = "1.0.0"
description = "Pay-per-use billing proxy for QuLab MCP server"
readme = "README.md"
license = {text = "Proprietary — All Rights Reserved"}
requires-python = ">=3.10"
authors = [{name = "Joshua Hendricks Cole", email = "jhendrickscole@aios.is"}]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.20.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "stripe>=8.0.0",
    "python-dotenv>=1.0.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.scripts]
qulab-billing = "qulab_billing.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qulab_billing"]
