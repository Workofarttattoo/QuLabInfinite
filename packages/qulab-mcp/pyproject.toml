[project]
name = "qulab-mcp"
version = "1.0.0"
description = "QuLab Infinite — 80+ scientific labs as an MCP server for AI assistants"
readme = "README.md"
license = {text = "Proprietary — All Rights Reserved"}
requires-python = ">=3.10"
authors = [
    {name = "Joshua Hendricks Cole", email = "jhendrickscole@aios.is"},
]
keywords = [
    "mcp", "model-context-protocol", "scientific-simulation",
    "quantum-computing", "genomics", "medical-diagnostics",
    "particle-physics", "astrophysics", "thermodynamics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.urls]
Homepage = "https://aios.is"
Repository = "https://github.com/Workofarttattoo/QuLabInfinite"
Documentation = "https://github.com/Workofarttattoo/QuLabInfinite/blob/main/packages/qulab-mcp/README.md"

[project.scripts]
qulab-mcp = "qulab_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qulab_mcp"]
