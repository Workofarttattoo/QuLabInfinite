<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Genomics Lab Visualizer</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "primary-dark": "#0b5cb5",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "accent-pink": "#ec137f",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                    backdropBlur: {
                        xs: '2px',
                    }
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(16, 25, 34, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .glass-card {
            background: rgba(19, 127, 236, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(19, 127, 236, 0.2);
        }

        /* Animated pulse for live status */
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; box-shadow: 0 0 5px #137fec; }
            50% { opacity: 0.6; box-shadow: 0 0 15px #137fec; }
        }
        .animate-pulse-glow {
            animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        /* Gradient text */
        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(to right, #137fec, #60a5fa);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-800 dark:text-white font-display antialiased h-screen overflow-hidden relative">
<!-- Background Visualizer (Immersive Layer) -->
<div class="absolute inset-0 z-0 bg-background-dark">
<!-- Main DNA Visualizer Image -->
<div class="absolute inset-0 bg-cover bg-center opacity-80" data-alt="Glowing 3D DNA double helix structure on dark background" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDdcmP2Ey6-8UezmXWkkA4ykpypK5CYV8X4WFG3GxypgkgITnMShAoIU-OWtybG-aSMWxJFU1pLFfTe_WLrUKAtvlEIOanc61zyxRH0FNB7WCGCvkpkMFqFEvD_lKy6azOssWzbCOX0iwJ8pW0p9vF1QTDT4nkfSOGYj2Zni_HcngfedR-ljGqDdyJi1Gqe1keh2Xa-j-c9hd6z0Id4R9-UZX9qKn-4n9fqa5lOh4uUPEFDrov6S24me8zs1EauNps5Tj2xachO74c');">
</div>
<!-- Gradient Overlay for readability -->
<div class="absolute inset-0 bg-gradient-to-b from-background-dark/80 via-transparent to-background-dark"></div>
<div class="absolute inset-0 bg-gradient-to-r from-background-dark/40 via-transparent to-background-dark/40"></div>
<!-- Decorative Grid Lines -->
<div class="absolute inset-0 opacity-10" style="background-image: linear-gradient(#137fec 1px, transparent 1px), linear-gradient(90deg, #137fec 1px, transparent 1px); background-size: 40px 40px;">
</div>
</div>
<!-- Main Content Container -->
<div class="relative z-10 flex flex-col h-full safe-area-inset-top safe-area-inset-bottom">
<!-- Top Navigation Bar -->
<header class="flex items-center justify-between px-6 pt-12 pb-4 w-full">
<div class="flex items-center gap-3">
<button class="w-10 h-10 flex items-center justify-center rounded-full glass-panel hover:bg-white/10 transition-colors">
<span class="material-icons text-white/80">arrow_back</span>
</button>
<div class="flex flex-col">
<h1 class="text-sm font-bold tracking-wider uppercase text-primary">QulabInfinite</h1>
<span class="text-xs text-slate-400">Production Node // 8015</span>
</div>
</div>
<div class="flex items-center gap-2 px-3 py-1.5 rounded-full glass-panel border-primary/30">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse-glow"></span>
<span class="text-xs font-semibold text-primary tracking-widest uppercase">Live</span>
</div>
</header>
<!-- Central Viewport Markers -->
<div class="flex-1 relative p-6">
<!-- Floating Markers in 3D Space (Simulated) -->
<div class="absolute top-1/4 left-1/4 flex items-center gap-2 opacity-80">
<div class="w-3 h-3 rounded-full border border-white/50 bg-primary/20"></div>
<div class="h-[1px] w-12 bg-gradient-to-r from-white/50 to-transparent"></div>
<span class="text-[10px] bg-black/40 px-1 rounded text-primary">Seq. A-T</span>
</div>
<div class="absolute top-1/3 right-8 flex flex-col items-end gap-1 opacity-90">
<div class="flex items-center gap-2">
<span class="text-[10px] font-bold text-accent-pink uppercase tracking-widest">Mutation Detect</span>
<div class="w-2 h-2 rounded-full bg-accent-pink animate-ping"></div>
</div>
<div class="text-[10px] text-slate-300 glass-panel px-2 py-1 rounded">Locus: 12p13.31</div>
</div>
<!-- Central HUD Overlay -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-64 h-64 border border-white/10 rounded-full flex items-center justify-center pointer-events-none">
<div class="w-56 h-56 border border-primary/20 rounded-full border-dashed animate-[spin_10s_linear_infinite]"></div>
<div class="absolute top-0 w-1 h-4 bg-primary/50"></div>
<div class="absolute bottom-0 w-1 h-4 bg-primary/50"></div>
<div class="absolute left-0 h-1 w-4 bg-primary/50"></div>
<div class="absolute right-0 h-1 w-4 bg-primary/50"></div>
</div>
</div>
<!-- Bottom Sheet / Control Panel -->
<div class="mt-auto w-full px-4 pb-6">
<!-- Glass Panel Container -->
<div class="glass-panel rounded-3xl p-5 w-full shadow-2xl shadow-black/50 border-t border-white/10">
<!-- Metrics Row -->
<div class="flex gap-3 mb-6 overflow-x-auto no-scrollbar pb-2">
<!-- Metric 1 -->
<div class="min-w-[140px] glass-card p-3 rounded-xl flex flex-col relative overflow-hidden group">
<div class="absolute -right-4 -top-4 w-12 h-12 bg-primary/20 blur-xl rounded-full"></div>
<div class="flex justify-between items-start mb-2">
<span class="text-[10px] font-medium text-slate-300 uppercase tracking-wide">Seq Depth</span>
<span class="material-icons text-primary text-sm">show_chart</span>
</div>
<div class="flex items-baseline gap-1">
<span class="text-2xl font-bold text-white">142x</span>
<span class="text-[10px] text-green-400">↑ 12%</span>
</div>
<div class="w-full h-1 bg-white/10 mt-3 rounded-full overflow-hidden">
<div class="h-full bg-primary w-3/4"></div>
</div>
</div>
<!-- Metric 2 -->
<div class="min-w-[140px] bg-white/5 border border-white/5 p-3 rounded-xl flex flex-col relative overflow-hidden">
<div class="flex justify-between items-start mb-2">
<span class="text-[10px] font-medium text-slate-300 uppercase tracking-wide">Error Rate</span>
<span class="material-icons text-slate-400 text-sm">history_toggle_off</span>
</div>
<div class="flex items-baseline gap-1">
<span class="text-2xl font-bold text-white">0.004<span class="text-sm text-slate-400">%</span></span>
</div>
<!-- Micro Sparkline SVG -->
<svg class="w-full h-4 mt-2 opacity-50" preserveaspectratio="none" viewbox="0 0 100 20">
<path class="text-green-400" d="M0 15 Q 10 18, 20 10 T 40 12 T 60 5 T 80 8 T 100 15" fill="none" stroke="currentColor" stroke-width="2"></path>
</svg>
</div>
<!-- Metric 3 -->
<div class="min-w-[140px] bg-white/5 border border-white/5 p-3 rounded-xl flex flex-col">
<div class="flex justify-between items-start mb-2">
<span class="text-[10px] font-medium text-slate-300 uppercase tracking-wide">Reads</span>
<span class="material-icons text-slate-400 text-sm">data_object</span>
</div>
<div class="flex items-baseline gap-1">
<span class="text-2xl font-bold text-white">4.2M</span>
<span class="text-[10px] text-slate-400">bp</span>
</div>
<div class="flex gap-1 mt-3">
<div class="h-1 w-1 rounded-full bg-primary animate-pulse"></div>
<div class="h-1 w-1 rounded-full bg-primary/50 animate-pulse delay-75"></div>
<div class="h-1 w-1 rounded-full bg-primary/20 animate-pulse delay-150"></div>
</div>
</div>
</div>
<!-- Echo's Message -->
<div class="flex items-start gap-3 mb-6 bg-gradient-to-r from-primary/10 to-transparent p-3 rounded-xl border-l-2 border-primary">
<div class="relative shrink-0">
<div class="w-10 h-10 rounded-full overflow-hidden border border-white/20">
<img class="w-full h-full object-cover" data-alt="Abstract feminine portrait with digital overlay representing Echo AI" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAqRQ2OW-ybA8nw7l0qnUF5N-rdCOO2_-pCfnvgrgXrkIopvKbYzxqIBS_KAgTsicDCuUBTgleYL8S93HqEVe7tAHdlb_Sa0dRVyiNMVDKkJ8HqpqNqqu6mvJbInwJ2qjoUIGL1e64Wo_hEmy8WCnVHvrDUl-U01Tp9PPjLf1nAmpDeeeqWuX5lacE9jW4Op3T9mg5bYIvGgKI2VGRg5CJGRr0exPGGx4AyIFxHqbSKrvdN8OT_DfYhrlx3HQfZnj-oP6MxPca2cFA"/>
</div>
<div class="absolute -bottom-1 -right-1 bg-background-dark p-0.5 rounded-full">
<span class="block w-2.5 h-2.5 bg-green-500 rounded-full border border-background-dark"></span>
</div>
</div>
<div class="flex flex-col">
<div class="flex items-center gap-2 mb-0.5">
<span class="text-xs font-bold text-white">Echo</span>
<span class="text-[10px] px-1 rounded bg-white/10 text-slate-400">Orchestrator</span>
</div>
<p class="text-sm text-slate-200 leading-snug">
                            Alignment with reference genome <span class="text-primary font-mono text-xs">GRCh38</span> complete. NIST-traceable accuracy confirmed.
                        </p>
</div>
</div>
<!-- Action Controls -->
<div class="grid grid-cols-4 gap-3">
<button class="col-span-1 flex flex-col items-center justify-center gap-1 p-3 rounded-xl bg-white/5 hover:bg-white/10 transition-all border border-transparent hover:border-white/10 group">
<span class="material-icons text-white group-hover:text-primary transition-colors">pause</span>
<span class="text-[10px] font-medium text-slate-400">Pause</span>
</button>
<button class="col-span-1 flex flex-col items-center justify-center gap-1 p-3 rounded-xl bg-white/5 hover:bg-white/10 transition-all border border-transparent hover:border-white/10 group">
<span class="material-icons text-white group-hover:text-primary transition-colors">analytics</span>
<span class="text-[10px] font-medium text-slate-400">Analyze</span>
</button>
<button class="col-span-1 flex flex-col items-center justify-center gap-1 p-3 rounded-xl bg-white/5 hover:bg-white/10 transition-all border border-transparent hover:border-white/10 group">
<span class="material-icons text-white group-hover:text-primary transition-colors">download</span>
<span class="text-[10px] font-medium text-slate-400">Export</span>
</button>
<button class="col-span-1 flex flex-col items-center justify-center gap-1 p-3 rounded-xl bg-primary hover:bg-primary-dark transition-all shadow-[0_0_15px_rgba(19,127,236,0.4)]">
<span class="material-icons text-white">science</span>
<span class="text-[10px] font-bold text-white">Full View</span>
</button>
</div>
</div>
</div>
</div>
</body></html>
