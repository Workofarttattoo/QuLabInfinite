[project]
name = "qulab-infinite"
version = "1.0.0"
description = "Infinite Scientific Simulation Platform — 100+ laboratories spanning every domain of science and engineering"
readme = "README.md"
license = {text = "Proprietary — All Rights Reserved"}
requires-python = ">=3.10"
authors = [
    {name = "Joshua Hendricks Cole", email = "jhendrickscole@aios.is"},
]
keywords = [
    "scientific-simulation",
    "quantum-computing",
    "medical-simulation",
    "materials-science",
    "drug-discovery",
    "computational-chemistry",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core dependencies — required for base functionality
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.6.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "typing-extensions>=4.9.0",
]

[project.optional-dependencies]
# Full scientific stack
science = [
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
    "sympy>=1.12",
    "scikit-learn>=1.4.0",
]

# Materials science
materials = [
    "pymatgen>=2024.2.20",
    "mendeleev>=0.16.2",
    "ase>=3.22.0",
]

# Quantum computing
quantum = [
    "qiskit>=1.0.0",
    "pennylane>=0.35.0",
]

# Medical / pharma
medical = [
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "lifelines>=0.29.0",
]

# Database
database = [
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
]

# Monitoring
monitoring = [
    "prometheus-client>=0.20.0",
    "psutil>=5.9.0",
]

# GUI
gui = [
    "PySide6>=6.6.0",
    "pyvista>=0.42.0",
]

# Development
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "httpx>=0.27.0",
]

# All extras
all = [
    "qulab-infinite[science,materials,quantum,medical,database,monitoring,dev]",
]

[project.urls]
Homepage = "https://aios.is"
Documentation = "https://github.com/Workofarttattoo/QuLabInfinite"
Repository = "https://github.com/Workofarttattoo/QuLabInfinite"
"Issue Tracker" = "https://github.com/Workofarttattoo/QuLabInfinite/issues"

[project.scripts]
qulab = "qulab.cli:main"
qulab-api = "qulab.api.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[tool.hatch.build.targets.wheel]
packages = ["qulab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100
fix = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
