apiVersion: apps/v1
kind: Deployment
metadata:
  name: qulab-mcp-api
  namespace: qulab
  labels:
    app: qulab-mcp-api
    version: v2.0.0
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qulab-mcp-api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: '8000'
        prometheus.io/scrape: 'true'
      labels:
        app: qulab-mcp-api
        version: v2.0.0
    spec:
      containers:
      - command:
        - python
        - -m
        - uvicorn
        - qulab.mcp.ech0_mcp_lite_public:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        env:
        - name: QULAB_ENV
          value: production
        - name: LOG_LEVEL
          value: INFO
        - name: WORKERS
          value: '4'
        image: bbbacr24042.azurecr.io/qulab-mcp:latest
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        name: qulab-mcp-api
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
      imagePullSecrets:
      - name: acr-secret
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      tolerations:
      - effect: NoSchedule
        key: workload
        operator: Equal
        value: api
---
apiVersion: v1
kind: Service
metadata:
  name: qulab-mcp-service
  namespace: qulab
  labels:
    app: qulab-mcp-api
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "false"
spec:
  type: LoadBalancer
  selector:
    app: qulab-mcp-api
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8000
