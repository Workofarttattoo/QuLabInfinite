version: '3.9'
services:
  qulab-mcp:
    build: .
    ports:
      - "8080:8080"
    environment:
      - MCP_MODE=production
      - MODEL_PROVIDER=${MODEL_PROVIDER:-grok}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
